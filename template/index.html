<style>
body{font-family:system-ui,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;line-height:1.62;padding:.7em 1em;background:#121212;color:#e8e8e8;max-width:840px;margin:0 auto;box-sizing:border-box;font-size:15px;position:relative}

.timestamp-section>h2[data-ts],.timestamp-section>h3[data-ts],.timestamp-section>h4[data-ts]{position:relative;border-bottom:none;border-left:4px solid #ff9800;border-radius:0 5px 5px 0;background:linear-gradient(90deg,rgba(255,152,0,.16),rgba(255,152,0,.04) 55%,transparent);padding:.22em .5em .22em .6em;margin-top:.15em;margin-bottom:.35em;scroll-margin-top:56px}
.timestamp-section>h2[data-ts]{font-size:1.24em;font-weight:800;color:#ffa726;letter-spacing:.01em}

.timestamp-section{scroll-margin-top:56px}
.heading-ts{display:inline-block;margin-left:.35em;padding:0 .4em;border-radius:4px;font-size:.72em;font-weight:600;color:#ffcc80;background:rgba(255,152,0,.14);vertical-align:.12em;white-space:nowrap;cursor:pointer;font-variant-numeric:tabular-nums;transition:background .12s,color .12s}

.heading-ts:hover,.heading-ts:focus-visible{background:#ff9800;color:#111;text-decoration:underline;outline:none}
.secnav-chip{position:fixed;z-index:185;display:flex;align-items:stretch;height:30px;max-width:520px;box-sizing:border-box;border:1px solid rgba(255,152,0,.35);border-radius:16px;background:rgba(22,22,22,.86);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 3px 12px rgba(0,0,0,.45);font-size:12.5px;color:#ffcc80;opacity:.82;transition:opacity .15s,transform .18s,border-color .15s,visibility .18s;overflow:hidden}

.secnav-toc-icon{font-size:15px;line-height:1}
.secnav-count{font-size:11px;color:#bbb}

.secnav-jump:hover,.secnav-jump:focus-visible{background:rgba(255,152,0,.12) !important;outline:none}
.secnav-arrow{flex:0 0 auto;color:#ff9800;font-weight:700}
.secnav-time{flex:0 0 auto;color:#999;font-size:11px;font-variant-numeric:tabular-nums}
.secnav-label{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#eee}
.toc-backdrop{position:fixed;inset:0;z-index:240;background:rgba(0,0,0,.42);opacity:0;visibility:hidden;transition:opacity .15s,visibility .15s}
.toc-backdrop.is-open{opacity:1;visibility:visible}
.toc-panel{position:fixed;z-index:241;top:8px;width:440px;max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);display:flex;flex-direction:column;box-sizing:border-box;background:#1b1b1b;border:1px solid #4a3a22;border-radius:12px;box-shadow:0 14px 44px rgba(0,0,0,.7);overflow:hidden;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .15s,transform .15s,visibility .15s}
.toc-panel.is-open{opacity:1;visibility:visible;transform:none}
.toc-head{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:9px 10px 9px 14px;border-bottom:1px solid #333;background:#202020}
.toc-title{flex:1;font-weight:700;color:#ff9800;font-size:.95rem}
.toc-hint{font-size:11px;color:#777}
.toc-close{border:0;background:transparent;color:#aaa;font-size:22px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:6px}
.toc-close:hover{color:#fff;background:#333}
.toc-list{list-style:none;margin:0;padding:6px;overflow-y:auto;overscroll-behavior:contain;scrollbar-color:#666 transparent}
.toc-list li{margin:0;display:flex;align-items:stretch;border-radius:7px}
.toc-item{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;text-align:left;font:inherit;font-size:13.5px;line-height:1.4;color:#ccc;background:transparent;border:0;border-left:3px solid transparent;border-radius:7px;padding:6px 8px;cursor:pointer}
.toc-item:hover,.toc-item:focus-visible{background:#2a2a2a;color:#fff;outline:none}
.toc-item:focus-visible{box-shadow:inset 0 0 0 1px #ff9800}
.toc-num{flex:0 0 auto;color:#666;font-size:11px;min-width:1.6em;text-align:right;font-variant-numeric:tabular-nums}
.toc-text{min-width:0}
.toc-lv1 .toc-item{color:#ffb74d;font-weight:700}
.toc-lv3 .toc-item{padding-left:20px}
.toc-lv4 .toc-item{padding-left:32px}
.toc-time{flex:0 0 auto;align-self:center;margin-right:4px;border:0;border-radius:10px;background:#333;color:#bbb;font:inherit;font-size:11px;padding:1px 7px;cursor:pointer;font-variant-numeric:tabular-nums}
.toc-time:hover,.toc-time:focus-visible{background:#ff9800;color:#111;outline:none}
.toc-list li.is-current .toc-item{background:rgba(255,152,0,.13);border-left-color:#ff9800;color:#fff}

@media (max-width:600px){.toc-panel{top:auto;bottom:0;left:0 !important;width:100vw;max-width:100vw;max-height:78vh;border-radius:14px 14px 0 0;transform:translateY(16px)}.toc-panel.is-open{transform:none}.toc-item{padding:9px 8px;font-size:14px}.toc-hint{display:none}}
@media (prefers-reduced-motion:reduce){.secnav-chip,.toc-panel,.toc-backdrop{transition:none}}

@media (min-width:1181px){body{max-width:960px;margin-left:220px;margin-right:24px}}
@media (min-width:1280px){body{margin-right:400px}.transcript-panel{transform:none}.transcript-toggle,.transcript-close{display:none}}
@media (max-width:1279px){body.transcript-open{overflow:hidden}.transcript-panel{top:8px;right:8px;bottom:8px;width:min(360px,calc(100vw - 16px))}}

<script>
(function() {
  // --- CONFIG: 表示側で加工する設定 ---
  var CONFIG = {
    proxyDomain: 'www.yout-ube.com',
    embedParams: 'autoplay=1&mute=1'
  };
  // file:// では YouTube embed が origin 無しで再生不可(エラー153)のため従来のプロキシ方式、
  // http(s) では youtube-nocookie + IFrame API を使う。失敗時はプロキシへフォールバック。
  var useYouTubeApi = location.protocol !== 'file:';
  console.log('[player] mode =', useYouTubeApi ? 'youtube-iframe-api' : 'proxy (file://)');

  // --- ユーティリティ ---
  function escapeHtml(text) {
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(text));
    return d.innerHTML;
  }

  function makeProxyUrl(url) {
    if (!url) return '';
    return url.replace('www.youtube.com/', CONFIG.proxyDomain + '/');
  }

  function makeVideoLink(url, timestampSec) {
    if (!url) return '';
    var proxyUrl = makeProxyUrl(url);
    // &t= が末尾にある場合はそのまま秒数を付ける
    if (proxyUrl.indexOf('&t=') !== -1) {
      // 既に &t= がある場合、末尾の値を置き換え
      return proxyUrl.replace(/&t=.*$/, '&t=' + timestampSec);
    }
    return proxyUrl + (proxyUrl.indexOf('?') !== -1 ? '&' : '?') + 't=' + timestampSec;
  }

  function makeEmbedUrl(videoId, timestampSec) {
    return 'https://www.youtube.com/embed/' + videoId + '?start=' + timestampSec + '&autoplay=1&mute=1&cc_load_policy=1';
  }

  function extractVideoId(url) {
    if (!url) return '';
    var m = url.match(/[?&]v=([a-zA-Z0-9_-]+)/);
    return m ? m[1] : '';
  }

  function formatTimestamp(sec) {
    if (sec == null) return '';
    var h = Math.floor(sec / 3600);
    var rem = sec % 3600;
    var m = Math.floor(rem / 60);
    var s = rem % 60;
    var pad = s < 10 ? '0' : '';
    if (h) return h + '時間' + m + '分' + pad + s + '秒頃';
    return m + '分' + pad + s + '秒頃';
  }

  function makeChatGptUrl(subtitleText) {
    var prompt = '以下は字幕の一部です。省略を行わずに、読み易い日本語の文章として整理して。\n' +
      '要約をしすぎないで、会話のディティールを残した書き方で。\n' +
      'ただし、長すぎるときは短い見出しなどをつけて読み易く。この指示への返答は不要なので、内容のみを出力して。\n' +
      '---\n\n' + subtitleText;
    return 'https://chatgpt.com/?temporary-chat=true&prompt=' + encodeURIComponent(prompt);
  }

  // --- データのデフォルト値を補完 ---
  var data = (typeof PAGE_DATA !== 'undefined') ? PAGE_DATA : {};
  if (!data.schema_version) data.schema_version = 1;
  if (!data.sections) data.sections = [];
  if (!data.video_id) data.video_id = extractVideoId(data.url || '');
  if (!data.thumbnail) data.thumbnail = 'Thumbnail.jpg';

  var videoId = data.video_id;
  var baseUrl = data.url || '';

  // --- サムネイル動画：特殊URLを使う単一プレイヤー ---
  // 通常のYouTube embedは使わず、従来どおり yout-ube.com のwatch URLを
  // 拡大iframe内へ読み込む。最初のクリックはプレイヤーを開くだけで、
  // 実際の再生ボタンはiframe内で利用者が押す。
  var globalVideo = {
    shell: null,
    viewport: null,
    iframe: null,
    apiMount: null,
    player: null,
    playerReady: false,
    pendingSec: null,
    readyTimeout: null,
    lastSec: 0,
    source: null,
    profile: null,
    forceDocked: false,
    userWidth: null,
    caption: null,
    captionText: null,
    captionStartTime: 0,
    captionStartedAt: 0,
    captionTimer: null,
    captionFocusTimer: null,
    awaitingPlaybackClick: false,
    captionArmedAt: 0,
    captionIndex: -1,
    scheduled: false
  };
  var PLAYER_DOCK_TOP = 20;
  var TEXT_AVOID_MIN_WIDTH = 320;
  var TEXT_AVOID_GAP = 18;
  var textAvoidScheduled = false;
  var keepActiveTranscriptVisible = function() {};
  var scheduleSectionNav = function() {};

  function ensureGlobalVideoPlayer() {
    if (globalVideo.shell) return;
    var shell = document.createElement('div');
    shell.className = 'global-video-player';
    shell.setAttribute('role', 'dialog');
    shell.setAttribute('aria-label', '動画プレイヤー');

    var viewport = document.createElement('div');
    viewport.className = 'global-video-viewport';
    var iframe = document.createElement('iframe');
    iframe.title = '動画再生';
    iframe.allowFullscreen = true;
    viewport.appendChild(iframe);
    var apiMount = document.createElement('div');
    viewport.appendChild(apiMount);
    iframe.style.display = useYouTubeApi ? 'none' : '';

    var close = document.createElement('button');
    close.className = 'global-video-close';
    close.type = 'button';
    close.setAttribute('aria-label', '動画を閉じる');
    close.textContent = '×';
    close.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      stopGlobalVideo();
    });

    var resize = document.createElement('div');
    resize.className = 'global-video-resize';
    resize.setAttribute('role', 'button');
    resize.setAttribute('aria-label', '動画プレイヤーの大きさを変更');
    resize.title = 'ドラッグして大きさを変更';
    resize.textContent = '↙';
    resize.addEventListener('pointerdown', function(e) {
      e.preventDefault();
      e.stopPropagation();
      var startX = e.clientX;
      var startWidth = shell.getBoundingClientRect().width;
      resize.setPointerCapture(e.pointerId);

      function onMove(moveEvent) {
        var requestedWidth = startWidth + (startX - moveEvent.clientX);
        globalVideo.userWidth = Math.max(240, requestedWidth);
        updateGlobalVideoPosition();
      }
      function onEnd(endEvent) {
        resize.releasePointerCapture(endEvent.pointerId);
        resize.removeEventListener('pointermove', onMove);
        resize.removeEventListener('pointerup', onEnd);
        resize.removeEventListener('pointercancel', onEnd);
      }
      resize.addEventListener('pointermove', onMove);
      resize.addEventListener('pointerup', onEnd);
      resize.addEventListener('pointercancel', onEnd);
    });

    var caption = document.createElement('div');
    caption.className = 'global-video-caption';
    caption.setAttribute('translate', 'no');
    caption.setAttribute('aria-live', 'off');
    var captionText = document.createElement('span');
    captionText.className = 'global-video-caption-text';
    caption.appendChild(captionText);

    // 要約ページ側の字幕(黄色DOM字幕)のON/OFF。字幕拡張をiframe内で使うときの
    // 二重表示を避けるためのトグル。設定はこのブラウザ内でのみ保持する。
    try { globalVideo.captionEnabled = localStorage.getItem('tts-caption-off') !== '1'; }
    catch (err) { globalVideo.captionEnabled = true; }
    var ccToggle = document.createElement('button');
    ccToggle.className = 'global-video-cc' + (globalVideo.captionEnabled ? '' : ' is-off');
    ccToggle.type = 'button';
    ccToggle.setAttribute('aria-label', '要約ページの字幕表示を切り替え');
    ccToggle.textContent = '字幕';
    ccToggle.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      globalVideo.captionEnabled = !globalVideo.captionEnabled;
      ccToggle.classList.toggle('is-off', !globalVideo.captionEnabled);
      try { localStorage.setItem('tts-caption-off', globalVideo.captionEnabled ? '0' : '1'); } catch (err) {}
      if (!globalVideo.captionEnabled) setVideoCaption('', false);
    });

    shell.appendChild(viewport);
    shell.appendChild(caption);
    shell.appendChild(ccToggle);
    shell.appendChild(close);
    shell.appendChild(resize);
    document.body.appendChild(shell);
    globalVideo.shell = shell;
    globalVideo.viewport = viewport;
    globalVideo.iframe = iframe;
    globalVideo.apiMount = apiMount;
    globalVideo.caption = caption;
    globalVideo.captionText = captionText;
  }

  function clearVideoCaptionTimers() {
    if (globalVideo.captionTimer) window.clearInterval(globalVideo.captionTimer);
    if (globalVideo.captionFocusTimer) window.clearInterval(globalVideo.captionFocusTimer);
    globalVideo.captionTimer = null;
    globalVideo.captionFocusTimer = null;
  }

  function setVideoCaption(text, hint) {
    if (!globalVideo.caption || !globalVideo.captionText) return;
    if (globalVideo.captionEnabled === false) text = '';
    globalVideo.captionText.textContent = text || '';
    globalVideo.caption.classList.toggle('is-visible', !!text);
    globalVideo.caption.classList.toggle('is-hint', !!hint);
    if (globalVideo.shell && globalVideo.shell.classList.contains('is-visible')) scheduleGlobalVideoPosition();
  }

  function renderVideoCaption(videoTime) {
    var cues = data.transcript || [];
    if (!cues.length) {
      setVideoCaption('', false);
      return;
    }
    var low = 0, high = cues.length - 1, found = -1;
    while (low <= high) {
      var mid = Math.floor((low + high) / 2);
      if (Number(cues[mid].start) <= videoTime) { found = mid; low = mid + 1; }
      else { high = mid - 1; }
    }
    if (found < 0) {
      globalVideo.captionIndex = -1;
      setVideoCaption('', false);
      return;
    }
    var cue = cues[found];
    var cueEnd = Number(cue.end);
    if (!isFinite(cueEnd)) cueEnd = found + 1 < cues.length ? Number(cues[found + 1].start) : videoTime + 1;
    if (videoTime > cueEnd + 0.15) {
      globalVideo.captionIndex = -1;
      setVideoCaption('', false);
      return;
    }
    var transcriptText = document.querySelector('.transcript-cue[data-transcript-index="' + found + '"] .transcript-text');
    var displayText = transcriptText && transcriptText.textContent.trim()
      ? transcriptText.textContent.trim()
      : (cue.text || '');
    if (globalVideo.captionIndex !== found ||
        !globalVideo.caption.classList.contains('is-visible') ||
        globalVideo.captionText.textContent !== displayText) {
      globalVideo.captionIndex = found;
      setVideoCaption(displayText, false);
    }
  }

  function startVideoCaptionClock() {
    if (!globalVideo.awaitingPlaybackClick) return;
    globalVideo.awaitingPlaybackClick = false;
    if (globalVideo.captionFocusTimer) window.clearInterval(globalVideo.captionFocusTimer);
    globalVideo.captionFocusTimer = null;
    globalVideo.captionStartedAt = performance.now();
    globalVideo.captionIndex = -1;
    renderVideoCaption(globalVideo.captionStartTime);
    globalVideo.captionTimer = window.setInterval(function() {
      var elapsed = (performance.now() - globalVideo.captionStartedAt) / 1000;
      renderVideoCaption(globalVideo.captionStartTime + elapsed);
    }, 160);
  }

  function checkVideoIframeFocus() {
    if (!globalVideo.awaitingPlaybackClick || !globalVideo.iframe) return;
    if (Date.now() - globalVideo.captionArmedAt < 300) return;
    if (document.activeElement === globalVideo.iframe) startVideoCaptionClock();
  }

  function armVideoCaption(startTime) {
    clearVideoCaptionTimers();
    globalVideo.captionStartTime = Math.max(0, Number(startTime) || 0);
    globalVideo.captionStartedAt = 0;
    globalVideo.captionIndex = -1;
    globalVideo.awaitingPlaybackClick = !!(data.transcript && data.transcript.length);
    globalVideo.captionArmedAt = Date.now();
    if (!globalVideo.awaitingPlaybackClick) {
      setVideoCaption('', false);
      return;
    }
    setVideoCaption('iframe内の再生ボタンを押すと字幕を開始します', true);
    globalVideo.captionFocusTimer = window.setInterval(checkVideoIframeFocus, 160);
  }

  window.addEventListener('blur', function() {
    window.setTimeout(checkVideoIframeFocus, 0);
  });

  function setIframeProfile(profile) {
    var frames = [globalVideo.iframe];
    if (globalVideo.player && globalVideo.player.getIframe) {
      try { frames.push(globalVideo.player.getIframe()); } catch (err) {}
    }
    for (var i = 0; i < frames.length; i++) {
      var f = frames[i];
      if (!f) continue;
      if (profile.kind === 'filmstrip') {
        f.style.width = '111.111%';
        f.style.height = '111.111%';
        f.style.transform = 'scale(0.9)';
      } else {
        f.style.width = '200%';
        f.style.height = '200%';
        f.style.transform = 'scale(0.5)';
      }
    }
  }

  // --- YouTube IFrame API 方式 ---
  var ytApiLoading = false;
  var ytApiQueue = [];

  function loadYouTubeApi(cb) {
    if (window.YT && window.YT.Player) { cb(); return; }
    ytApiQueue.push(cb);
    if (ytApiLoading) return;
    ytApiLoading = true;
    var prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = function() {
      if (typeof prev === 'function') prev();
      var q = ytApiQueue; ytApiQueue = [];
      for (var i = 0; i < q.length; i++) q[i]();
    };
    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    tag.onerror = function() { fallbackToProxy('iframe_api load failed'); };
    document.head.appendChild(tag);
  }

  function stopApiClock() {
    if (globalVideo.captionTimer) window.clearInterval(globalVideo.captionTimer);
    globalVideo.captionTimer = null;
  }

  function startApiClock() {
    stopApiClock();
    globalVideo.captionTimer = window.setInterval(function() {
      if (!globalVideo.player || !globalVideo.playerReady) return;
      var t = 0;
      try { t = globalVideo.player.getCurrentTime(); } catch (err) { return; }
      renderVideoCaption(t);
    }, 500);
  }

  function fallbackToProxy(reason) {
    if (!useYouTubeApi) return;
    useYouTubeApi = false;
    console.log('[player] fallback to proxy:', reason);
    if (globalVideo.readyTimeout) window.clearTimeout(globalVideo.readyTimeout);
    globalVideo.readyTimeout = null;
    if (globalVideo.player) {
      try { globalVideo.player.destroy(); } catch (err) {}
    }
    globalVideo.player = null;
    globalVideo.playerReady = false;
    globalVideo.pendingSec = null;
    if (!globalVideo.shell) return;
    globalVideo.iframe.style.display = '';
    if (globalVideo.shell.classList.contains('is-visible')) {
      if (globalVideo.profile) setIframeProfile(globalVideo.profile);
      armVideoCaption(globalVideo.lastSec);
      globalVideo.iframe.src = makeVideoLink(baseUrl, Math.floor(globalVideo.lastSec));
    }
  }

  function createApiPlayer(sec) {
    globalVideo.pendingSec = null;
    globalVideo.readyTimeout = window.setTimeout(function() {
      if (!globalVideo.playerReady) fallbackToProxy('onReady timeout');
    }, 8000);
    loadYouTubeApi(function() {
      if (!useYouTubeApi || globalVideo.player) return;
      globalVideo.player = new YT.Player(globalVideo.apiMount, {
        // www.youtube.com ホスト: 字幕拡張(YouTube Lean English)のcontent scriptが
        // embed iframe内で動ける対象にするため。cc_load_policy=1 で字幕を最初からON
        // にする（拡張は字幕トラックの取得を起点に動作する）。
        host: 'https://www.youtube.com',
        videoId: videoId,
        width: '100%',
        height: '100%',
        playerVars: { start: Math.floor(sec), autoplay: 1, mute: 1, playsinline: 1, rel: 0, cc_load_policy: 1, origin: location.origin },
        events: {
          onReady: function() {
            if (!useYouTubeApi) return;
            globalVideo.playerReady = true;
            if (globalVideo.readyTimeout) window.clearTimeout(globalVideo.readyTimeout);
            globalVideo.readyTimeout = null;
            var p = globalVideo.player;
            // 字幕拡張の読み上げ(iframe内のAudio再生)が自動再生制限に当たらないよう
            // allow属性にautoplayを保証する。
            try {
              var fr = p.getIframe();
              var allowAttr = fr.getAttribute('allow') || '';
              if (allowAttr.indexOf('autoplay') === -1) {
                fr.setAttribute('allow', (allowAttr ? allowAttr + '; ' : '') + 'autoplay');
              }
            } catch (err) {}
            if (!globalVideo.shell.classList.contains('is-visible')) { p.pauseVideo(); return; }
            if (globalVideo.profile) setIframeProfile(globalVideo.profile);
            try { p.unMute(); } catch (err) {}
            if (globalVideo.pendingSec != null) {
              p.seekTo(globalVideo.pendingSec, true);
              globalVideo.pendingSec = null;
            }
            p.playVideo();
          },
          onStateChange: function(e) {
            if (!useYouTubeApi) return;
            if (e.data === 1) {
              startApiClock();
              try { if (globalVideo.player.isMuted()) globalVideo.player.unMute(); } catch (err) {}
            } else if (e.data === 2 || e.data === 0) {
              stopApiClock();
              try { renderVideoCaption(globalVideo.player.getCurrentTime()); } catch (err) {}
            }
          },
          onError: function(e) {
            if (e.data === 101 || e.data === 150 || e.data === 153) fallbackToProxy('onError ' + e.data);
          }
        }
      });
      if (globalVideo.profile) setIframeProfile(globalVideo.profile);
    });
  }

  function playViaApi(sec) {
    globalVideo.lastSec = sec;
    clearVideoCaptionTimers();
    globalVideo.captionStartTime = sec;
    globalVideo.captionIndex = -1;
    globalVideo.awaitingPlaybackClick = false;
    renderVideoCaption(sec);
    var p = globalVideo.player;
    if (p && globalVideo.playerReady) {
      p.seekTo(sec, true);
      p.unMute();
      p.playVideo();
    } else if (p) {
      globalVideo.pendingSec = sec;
    } else {
      createApiPlayer(sec);
    }
  }

  function clearGlobalVideoTextAvoidance() {
    var avoided = document.querySelectorAll('.video-text-avoid');
    for (var i = 0; i < avoided.length; i++) {
      avoided[i].classList.remove('video-text-avoid');
      avoided[i].style.paddingRight = '';
    }
  }

  function getGlobalVideoObstructionRect() {
    if (!globalVideo.shell || !globalVideo.shell.classList.contains('is-visible') || !globalVideo.shell.classList.contains('is-docked')) return null;
    var rect = globalVideo.shell.getBoundingClientRect();
    var bottom = rect.bottom;
    if (globalVideo.caption && globalVideo.caption.classList.contains('is-visible')) {
      bottom = Math.max(bottom, globalVideo.caption.getBoundingClientRect().bottom);
    }
    return {
      left: rect.left,
      right: rect.right,
      top: rect.top,
      bottom: bottom
    };
  }

  function updateGlobalVideoTextAvoidance() {
    textAvoidScheduled = false;
    var obstruction = getGlobalVideoObstructionRect();
    if (!obstruction) {
      clearGlobalVideoTextAvoidance();
      return;
    }

    var targets = document.querySelectorAll('.timestamp-section p,.timestamp-section li,.timestamp-section h1,.timestamp-section h2,.timestamp-section h3,.timestamp-section h4,.detail-section p,.detail-section li,.detail-section h1,.detail-section h2,.detail-section h3,.detail-section h4');
    var safeRight = obstruction.left - TEXT_AVOID_GAP;
    for (var i = 0; i < targets.length; i++) {
      var el = targets[i];
      var rect = el.getBoundingClientRect();
      var overlapsVertically = rect.bottom > obstruction.top - 4 && rect.top < obstruction.bottom + TEXT_AVOID_GAP;
      var overlapsHorizontally = rect.right > obstruction.left && rect.left < obstruction.right;
      var readableWidth = safeRight - rect.left;
      if (overlapsVertically && overlapsHorizontally && readableWidth >= TEXT_AVOID_MIN_WIDTH) {
        var paddingRight = Math.max(0, Math.ceil(rect.right - safeRight));
        el.classList.add('video-text-avoid');
        el.style.paddingRight = paddingRight + 'px';
      } else {
        el.classList.remove('video-text-avoid');
        el.style.paddingRight = '';
      }
    }
  }

  function scheduleGlobalVideoTextAvoidance() {
    if (textAvoidScheduled) return;
    textAvoidScheduled = true;
    window.requestAnimationFrame(updateGlobalVideoTextAvoidance);
  }

  function setPlayerBox(left, top, width, height, docked) {
    var shell = globalVideo.shell;
    shell.style.left = Math.round(left) + 'px';
    shell.style.top = Math.round(top) + 'px';
    shell.style.width = Math.round(width) + 'px';
    shell.style.height = Math.round(height) + 'px';
    shell.classList.toggle('is-docked', docked);
    keepActiveTranscriptVisible();
    scheduleSectionNav();
    scheduleGlobalVideoTextAvoidance();
  }

  function dockGlobalVideoPlayer() {
    var rightBoundary = window.innerWidth - 16;
    var availableWidth = Math.max(1, rightBoundary - 16);
    var requestedWidth = globalVideo.userWidth || 480;
    var maximumWidth = availableWidth;
    var transcript = document.querySelector('.transcript-panel');
    var activeCue = document.querySelector('.transcript-cue.is-active');
    if (transcript && activeCue) {
      var transcriptRect = transcript.getBoundingClientRect();
      var list = transcript.querySelector('.transcript-list');
      var transcriptVisible = window.innerWidth >= 1280 || transcript.classList.contains('is-open');
      if (transcriptVisible && list && rightBoundary > transcriptRect.left) {
        var listRect = list.getBoundingClientRect();
        var captionHeight = globalVideo.caption && globalVideo.caption.classList.contains('is-visible')
          ? globalVideo.caption.getBoundingClientRect().height + 5
          : 0;
        var maximumBottom = listRect.bottom - activeCue.getBoundingClientRect().height - 20 - captionHeight;
        maximumWidth = Math.min(maximumWidth, Math.max(240, (maximumBottom - PLAYER_DOCK_TOP) * 16 / 9));
      }
    }
    var dockWidth = Math.min(requestedWidth, maximumWidth);
    var dockHeight = dockWidth * 9 / 16;
    setPlayerBox(rightBoundary - dockWidth, PLAYER_DOCK_TOP, dockWidth, dockHeight, true);
  }

  function updateGlobalVideoPosition() {
    globalVideo.scheduled = false;
    if (!globalVideo.shell) return;
    if (globalVideo.forceDocked) {
      dockGlobalVideoPlayer();
      return;
    }
    if (!globalVideo.source) return;
    if (!document.documentElement.contains(globalVideo.source)) {
      stopGlobalVideo();
      return;
    }

    var rect = globalVideo.source.getBoundingClientRect();
    var profile = globalVideo.profile;
    var desired;
    if (profile.kind === 'filmstrip') {
      var filmWidth = globalVideo.userWidth || rect.width * 3;
      desired = { left: rect.left, top: rect.top, width: filmWidth, height: filmWidth * 9 / 16 };
    } else {
      var scale = 1.8;
      var width = globalVideo.userWidth || rect.width * scale;
      var height = width * 9 / 16;
      var extraWidth = width - rect.width;
      var left = rect.left;
      if (profile.origin === 'center') left -= extraWidth / 2;
      if (profile.origin === 'right') left -= extraWidth;
      desired = {
        left: left,
        top: rect.top - (height - rect.height) / 2,
        width: width,
        height: height
      };
    }

    var sourceOutside = rect.bottom <= 0 || rect.top >= window.innerHeight || rect.right <= 0 || rect.left >= window.innerWidth;
    var docked = sourceOutside || desired.top < 12;
    if (docked) {
      dockGlobalVideoPlayer();
    } else {
      setPlayerBox(desired.left, desired.top, desired.width, desired.height, false);
    }
  }

  function scheduleGlobalVideoPosition() {
    if (!globalVideo.shell || !globalVideo.shell.classList.contains('is-visible') || globalVideo.scheduled) return;
    globalVideo.scheduled = true;
    window.requestAnimationFrame(updateGlobalVideoPosition);
  }

  function startGlobalVideo(source, url, profile, forceDocked, startTime) {
    ensureGlobalVideoPlayer();
    // APIモードは字幕を getCurrentTime() で同期するためクリック位置に出す必要がなく、常に右上dockに表示する。
    forceDocked = !!forceDocked || useYouTubeApi;
    if (!useYouTubeApi && globalVideo.source === source && globalVideo.iframe.src === url && globalVideo.forceDocked === forceDocked) return;
    if (globalVideo.source) globalVideo.source.classList.remove('is-playing');
    globalVideo.source = source;
    globalVideo.profile = profile;
    globalVideo.forceDocked = forceDocked;
    if (source) source.classList.add('is-playing');
    setIframeProfile(profile);
    globalVideo.shell.classList.add('is-visible');
    updateGlobalVideoPosition();
    if (useYouTubeApi && videoId) {
      playViaApi(Math.max(0, Number(startTime) || 0));
      return;
    }
    globalVideo.lastSec = Math.max(0, Number(startTime) || 0);
    armVideoCaption(startTime);
    // サイズ確定後に特殊watch URLを読み込む。autoplay指定は付けない。
    globalVideo.iframe.src = url;
  }

  function stopGlobalVideo() {
    if (globalVideo.source) globalVideo.source.classList.remove('is-playing');
    globalVideo.source = null;
    globalVideo.profile = null;
    globalVideo.forceDocked = false;
    globalVideo.awaitingPlaybackClick = false;
    clearVideoCaptionTimers();
    setVideoCaption('', false);
    if (globalVideo.iframe) globalVideo.iframe.src = '';
    if (globalVideo.player && globalVideo.playerReady) {
      try { globalVideo.player.pauseVideo(); } catch (err) {}
    }
    globalVideo.pendingSec = null;
    if (globalVideo.shell) {
      globalVideo.shell.classList.remove('is-visible');
      globalVideo.shell.classList.remove('is-docked');
    }
    keepActiveTranscriptVisible();
    clearGlobalVideoTextAvoidance();
    scheduleSectionNav();
  }

  window.addEventListener('scroll', scheduleGlobalVideoPosition, { passive: true });
  window.addEventListener('resize', scheduleGlobalVideoPosition);

  function startGlobalVideoAtTime(timestampSec) {
    var candidates = document.querySelectorAll('[data-thumb-start]');
    var nearest = null;
    var nearestDistance = Infinity;
    for (var i = 0; i < candidates.length; i++) {
      var candidateTime = Number(candidates[i].getAttribute('data-thumb-start'));
      var distance = Math.abs(candidateTime - timestampSec);
      if (distance < nearestDistance) {
        nearest = candidates[i];
        nearestDistance = distance;
      }
    }

    var profile = { kind: 'grid', origin: 'center' };
    if (nearest) {
      if (nearest.classList.contains('filmstrip-frame')) {
        profile = { kind: 'filmstrip' };
      } else {
        profile.origin = nearest.getAttribute('data-player-origin') || 'center';
      }
    }
    startGlobalVideo(nearest, makeVideoLink(baseUrl, Math.floor(timestampSec)), profile, true, timestampSec);
  }

  // --- タブタイトルをh1見出しから設定 ---
  if (!data.title) {
    var fallbackTitle = '';
    for (var ti = 0; ti < data.sections.length; ti++) {
      if (data.sections[ti].level === 1 && data.sections[ti].heading) {
        if (!fallbackTitle) fallbackTitle = data.sections[ti].heading;
        if (data.sections[ti].heading !== '動画のポイント') {
          document.title = data.sections[ti].heading;
          fallbackTitle = '';
          break;
        }
      }
    }
    if (fallbackTitle) document.title = fallbackTitle;
  }

  // --- サムネイル ---
  if (data.thumbnail) {
    var thumb = document.createElement('img');
    thumb.src = data.thumbnail;
    thumb.className = 'video-thumbnail';
    thumb.alt = 'Video Thumbnail';
    thumb.onerror = function() { this.style.display = 'none'; };
    document.body.appendChild(thumb);
  }

  // --- Description 構築関数（h1 直後に挿入するため関数化）---
  // 1行=1ブロック要素。'\n' テキストノード＋pre-wrap 方式はブラウザ翻訳で改行が失われるため使わない
  function makeDescLine(line) {
    var div = document.createElement('div');
    div.className = 'desc-line';
    var urlRe = /https?:\/\/[^\s)]+/g;
    var lastIdx = 0, m;
    while ((m = urlRe.exec(line)) !== null) {
      if (m.index > lastIdx) div.appendChild(document.createTextNode(line.slice(lastIdx, m.index)));
      var a = document.createElement('a');
      a.href = m[0]; a.target = '_blank'; a.rel = 'noopener'; a.textContent = m[0];
      div.appendChild(a);
      lastIdx = m.index + m[0].length;
    }
    if (lastIdx < line.length) div.appendChild(document.createTextNode(line.slice(lastIdx)));
    return div;
  }

  function buildDescriptionBlock() {
    if (!data.description) return null;
    var descDiv = document.createElement('div');
    descDiv.className = 'description-block';
    descDiv.setAttribute('translate', 'yes');
    // 末尾の空白・空行を削り、3行以上続く空行は2行へ畳む（データは変更せず表示側で整形）
    var descText = String(data.description)
      .replace(/\r\n?/g, '\n')
      .replace(/[ \t\u3000]+$/gm, '')
      .replace(/^\s*\n/, '')
      .replace(/\n{3,}/g, '\n\n')
      .replace(/\s+$/, '');
    if (!descText) return null;
    var descLines = descText.split('\n');
    var VISIBLE_LINES = 5;
    var visibleDiv = document.createElement('div');
    visibleDiv.className = 'desc-visible';
    for (var di = 0; di < Math.min(VISIBLE_LINES, descLines.length); di++) {
      visibleDiv.appendChild(makeDescLine(descLines[di]));
    }
    descDiv.appendChild(visibleDiv);
    if (descLines.length > VISIBLE_LINES) {
      var descDetails = document.createElement('details');
      descDetails.className = 'desc-details';
      var descSummary = document.createElement('summary');
      descSummary.textContent = '続きを表示';
      descDetails.appendChild(descSummary);
      var moreDiv = document.createElement('div');
      moreDiv.className = 'desc-more';
      for (var di2 = VISIBLE_LINES; di2 < descLines.length; di2++) {
        moreDiv.appendChild(makeDescLine(descLines[di2]));
      }
      var closeBtn = document.createElement('button');
      closeBtn.className = 'desc-close-btn';
      closeBtn.textContent = '▲ 閉じる';
      (function(det) {
        closeBtn.addEventListener('click', function() { det.open = false; });
      })(descDetails);
      moreDiv.appendChild(closeBtn);
      descDetails.appendChild(moreDiv);
      descDiv.appendChild(descDetails);
    }
    return descDiv;
  }
  var descInserted = false;

  // 見出し末尾の「（動画：X分Y秒頃）」を本文と時刻表記に分ける
  function splitHeadingTime(heading) {
    heading = heading || '';
    var m = /\s*([（(]\s*動画\s*[：:][^（）()]*[）)])\s*$/.exec(heading);
    if (!m || !m.index) return { text: heading, time: '' };
    return { text: heading.slice(0, m.index), time: m[1] };
  }
  function onSeekClick(e) {
    e.preventDefault();
    e.stopPropagation();
    startGlobalVideoAtTime(Number(this.getAttribute('data-video-time')));
  }
  function onSeekKey(e) {
    if (e.key === 'Enter' || e.key === ' ') onSeekClick.call(this, e);
  }

  // --- 詳細へのジャンプリンク ---
  if (data.detail) {
    var jumpDiv = document.createElement('div');
    jumpDiv.className = 'jump-link';
    jumpDiv.innerHTML = "<a href='#detail-section'>📄 詳細に飛ぶ</a>";
    document.body.appendChild(jumpDiv);
  }

  // --- セクション描画 ---
  for (var i = 0; i < data.sections.length; i++) {
    var sec = data.sections[i];
    var sectionDiv = document.createElement('div');
    sectionDiv.className = 'timestamp-section';

    // 見出し
    if (sec.heading) {
      var level = sec.level || 2;
      if (level < 1) level = 1;
      if (level > 4) level = 4;
      var h = document.createElement('h' + level);
      var headingParts = splitHeadingTime(sec.heading);
      if (headingParts.time && sec.timestamp != null) {
        // 見出し末尾の「（動画：X分Y秒頃）」だけを動画シーク用のクリック対象にする
        h.textContent = headingParts.text;
        var tsSpan = document.createElement('span');
        tsSpan.className = 'heading-ts';
        tsSpan.textContent = headingParts.time;
        tsSpan.setAttribute('role', 'button');
        tsSpan.setAttribute('tabindex', '0');
        tsSpan.setAttribute('title', 'この時刻から動画を再生');
        tsSpan.setAttribute('data-video-time', sec.timestamp);
        tsSpan.addEventListener('click', onSeekClick);
        tsSpan.addEventListener('keydown', onSeekKey);
        h.appendChild(tsSpan);
      } else {
        h.textContent = sec.heading;
      }
      h.setAttribute('data-heading-label', headingParts.text || sec.heading);
      if (sec.timestamp != null) h.setAttribute('data-ts', sec.timestamp);
      sectionDiv.appendChild(h);
    }

    // 本文 (HTML変換済み)
    if (sec.body) {
      var bodyDiv = document.createElement('div');
      bodyDiv.innerHTML = sec.body;
      sectionDiv.appendChild(bodyDiv);
    }

    // 画像グリッド（クリックで拡大プレイヤーを開く）
    if (sec.images && sec.images.length > 0) {
      var gridDiv = document.createElement('div');
      gridDiv.className = 'timestamp-images';
      for (var j = 0; j < sec.images.length; j++) {
        var img = sec.images[j];
        var startSec = Math.floor(img.start);
        var clickUrl = makeVideoLink(baseUrl, startSec);

        var container = document.createElement('div');
        container.className = 'thumb-container';
        container.setAttribute('data-url', clickUrl);
        container.setAttribute('data-thumb-start', startSec);
        container.setAttribute('data-player-origin', j % 3 === 0 ? 'left' : (j % 3 === 1 ? 'center' : 'right'));

        var thumbImg = document.createElement('img');
        thumbImg.className = 'thumb-img';
        thumbImg.src = img.src;
        thumbImg.loading = 'lazy';

        container.appendChild(thumbImg);
        gridDiv.appendChild(container);

        container.addEventListener('click', function(e) {
          e.preventDefault();
          startGlobalVideo(this, this.getAttribute('data-url'), {
            kind: 'grid',
            origin: this.getAttribute('data-player-origin')
          }, false, Number(this.getAttribute('data-thumb-start')));
        });
      }
      sectionDiv.appendChild(gridDiv);
    }

    // 動画リンク
    if (sec.timestamp != null) {
      var linkP = document.createElement('p');
      var linkA = document.createElement('a');
      linkA.href = makeVideoLink(baseUrl, sec.timestamp);
      linkA.setAttribute('data-video-time', sec.timestamp);
      linkA.textContent = '▶ 動画：' + formatTimestamp(sec.timestamp);
      linkA.addEventListener('click', function(e) {
        e.preventDefault();
        startGlobalVideoAtTime(Number(this.getAttribute('data-video-time')));
      });
      linkP.appendChild(linkA);
      sectionDiv.appendChild(linkP);
    }

    document.body.appendChild(sectionDiv);

    // タイトルセクションの直後に description を挿入
    if (!descInserted && data.title && sec.heading === data.title) {
      descInserted = true;
      var db = buildDescriptionBlock();
      if (db) document.body.appendChild(db);
    }
  }

  // --- 詳細セクション ---
  if (data.detail) {
    var detailDiv = document.createElement('div');
    detailDiv.id = 'detail-section';
    detailDiv.className = 'detail-section';
    detailDiv.innerHTML = '<h2>📄 詳細内容</h2>' + data.detail;
    document.body.appendChild(detailDiv);
  }

  // --- 右レール：見出し時刻と緩く同期する字幕タイムライン ---
  function buildTranscript() {
    var cues = data.transcript || [];
    if (!cues.length) return;

    var panel = document.createElement('aside');
    panel.className = 'transcript-panel';
    panel.setAttribute('translate', 'yes');
    panel.setAttribute('aria-label', '字幕タイムライン');

    var header = document.createElement('div');
    header.className = 'transcript-header';
    var titleEl = document.createElement('div');
    titleEl.className = 'transcript-title';
    titleEl.textContent = '字幕';
    var syncLabel = document.createElement('span');
    syncLabel.className = 'transcript-sync-label';
    syncLabel.textContent = '本文と同期';
    var closeButton = document.createElement('button');
    closeButton.className = 'transcript-close';
    closeButton.type = 'button';
    closeButton.setAttribute('aria-label', '字幕を閉じる');
    closeButton.textContent = '×';
    header.appendChild(titleEl);
    header.appendChild(syncLabel);
    header.appendChild(closeButton);
    panel.appendChild(header);

    var list = document.createElement('div');
    list.className = 'transcript-list';
    var sectionTimes = [];
    for (var si = 0; si < data.sections.length; si++) {
      if (data.sections[si].timestamp != null) sectionTimes.push(Number(data.sections[si].timestamp));
    }
    sectionTimes.sort(function(a, b) { return a - b; });
    var boundaryIndexes = {};
    var cueIndex = 0;
    for (var st = 0; st < sectionTimes.length; st++) {
      while (cueIndex < cues.length - 1 && Number(cues[cueIndex].start) < sectionTimes[st]) cueIndex++;
      boundaryIndexes[cueIndex] = true;
    }

    var cueElements = [];
    for (var ci = 0; ci < cues.length; ci++) {
      var cue = cues[ci];
      var row = document.createElement('a');
      row.className = 'transcript-cue' + (boundaryIndexes[ci] ? ' is-section-start' : '');
      row.href = makeVideoLink(baseUrl, Math.floor(cue.start));
      row.setAttribute('data-transcript-index', ci);
      row.setAttribute('data-cue-start', cue.start);
      row.addEventListener('click', function(e) {
        e.preventDefault();
        if (window.innerWidth < 1280) setPanelOpen(false);
        startGlobalVideoAtTime(Number(this.getAttribute('data-cue-start')));
      });
      var time = document.createElement('span');
      time.className = 'transcript-time';
      time.textContent = formatClock(cue.start);
      var textEl = document.createElement('span');
      textEl.className = 'transcript-text';
      textEl.textContent = cue.text;
      row.appendChild(time);
      row.appendChild(textEl);
      list.appendChild(row);
      cueElements.push(row);
    }
    panel.appendChild(list);
    document.body.appendChild(panel);

    var toggle = document.createElement('button');
    toggle.className = 'transcript-toggle';
    toggle.type = 'button';
    toggle.textContent = '字幕';
    toggle.setAttribute('aria-label', '字幕タイムラインを開く');
    document.body.appendChild(toggle);

    function setPanelOpen(open) {
      panel.classList.toggle('is-open', open);
      document.body.classList.toggle('transcript-open', open);
    }
    toggle.addEventListener('click', function() { setPanelOpen(true); });
    closeButton.addEventListener('click', function() { setPanelOpen(false); });

    var anchors = [];
    function rebuildAnchors() {
      anchors = [];
      var hs = document.querySelectorAll('[data-ts]');
      for (var hi = 0; hi < hs.length; hi++) {
        var anchorTime = parseFloat(hs[hi].getAttribute('data-ts'));
        if (isNaN(anchorTime)) continue;
        anchors.push({
          t: anchorTime,
          y: hs[hi].getBoundingClientRect().top + window.pageYOffset
        });
      }
      anchors.sort(function(a, b) { return a.t - b.t; });
      if (!anchors.length) return;
      var endTime = Math.max(Number(data.duration) || 0, Number(cues[cues.length - 1].end) || 0, anchors[anchors.length - 1].t + 1);
      anchors.push({ t: endTime, y: Math.max(document.documentElement.scrollHeight, anchors[anchors.length - 1].y + 1) });
    }

    function yToTime(y) {
      if (!anchors.length) return 0;
      if (y <= anchors[0].y) return anchors[0].t;
      for (var ai = 0; ai < anchors.length - 1; ai++) {
        var a = anchors[ai], b = anchors[ai + 1];
        if (y >= a.y && y <= b.y) {
          return b.y === a.y ? a.t : a.t + (y - a.y) / (b.y - a.y) * (b.t - a.t);
        }
      }
      return anchors[anchors.length - 1].t;
    }

    var activeIndex = -1;
    var manualUntil = 0;
    var scheduled = false;
    keepActiveTranscriptVisible = function() {
      if (activeIndex < 0 || !globalVideo.shell || !globalVideo.shell.classList.contains('is-visible')) {
        list.style.paddingTop = '8px';
        return;
      }
      var panelRect = panel.getBoundingClientRect();
      var playerRect = globalVideo.shell.getBoundingClientRect();
      var obstructionBottom = playerRect.bottom;
      if (globalVideo.caption && globalVideo.caption.classList.contains('is-visible')) {
        obstructionBottom = Math.max(obstructionBottom, globalVideo.caption.getBoundingClientRect().bottom);
      }
      var listRect = list.getBoundingClientRect();
      var overlapsHorizontally = playerRect.right > panelRect.left && playerRect.left < panelRect.right;
      var overlapsList = obstructionBottom > listRect.top && playerRect.top < listRect.bottom;
      if (!overlapsHorizontally || !overlapsList) {
        list.style.paddingTop = '8px';
        return;
      }

      var active = cueElements[activeIndex];
      var safeTop = Math.max(listRect.top + 8, obstructionBottom + 12);
      list.style.paddingTop = Math.max(8, safeTop - listRect.top) + 'px';
      var activeRect = active.getBoundingClientRect();
      var latestTop = listRect.bottom - activeRect.height - 8;
      var targetTop = Math.min(safeTop, latestTop);
      if (activeRect.top < safeTop || activeRect.bottom > listRect.bottom - 8) {
        list.scrollTop = Math.max(0, list.scrollTop + activeRect.top - targetTop);
      }
    };
    function syncTranscript() {
      scheduled = false;
      var markerY = window.pageYOffset + window.innerHeight * 0.3;
      var currentTime = yToTime(markerY);
      var low = 0, high = cues.length - 1, found = 0;
      while (low <= high) {
        var mid = Math.floor((low + high) / 2);
        if (Number(cues[mid].start) <= currentTime) { found = mid; low = mid + 1; }
        else { high = mid - 1; }
      }
      if (found === activeIndex) return;
      if (activeIndex >= 0) cueElements[activeIndex].classList.remove('is-active');
      activeIndex = found;
      cueElements[activeIndex].classList.add('is-active');
      if (Date.now() >= manualUntil) {
        list.scrollTop = Math.max(0, cueElements[activeIndex].offsetTop - list.clientHeight * 0.3);
      }
      keepActiveTranscriptVisible();
    }

    function scheduleSync() {
      if (scheduled) return;
      scheduled = true;
      window.requestAnimationFrame(syncTranscript);
    }
    function pauseAutoSync() { manualUntil = Date.now() + 4000; }
    list.addEventListener('wheel', pauseAutoSync, { passive: true });
    list.addEventListener('pointerdown', pauseAutoSync);
    list.addEventListener('touchstart', pauseAutoSync, { passive: true });
    window.addEventListener('scroll', scheduleSync, { passive: true });
    window.addEventListener('resize', function() { rebuildAnchors(); scheduleSync(); });
    window.addEventListener('load', function() { rebuildAnchors(); scheduleSync(); });
    rebuildAnchors();
    scheduleSync();
  }

  function formatClock(sec) {
    sec = Math.max(0, Math.floor(Number(sec) || 0));
    var h = Math.floor(sec / 3600);
    var m = Math.floor((sec % 3600) / 60);
    var s = sec % 60;
    if (h) return h + ':' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  buildTranscript();

  // --- 左レール：全ストーリーボードを時刻で本文に合わせて並べる ---
  function buildFilmstrip() {
    var frames = data.filmstrip;
    var old = document.getElementById('filmstrip-rail');
    if (old) {
      if (globalVideo.source && old.contains(globalVideo.source)) stopGlobalVideo();
      old.parentNode.removeChild(old);
    }
    if (!frames || !frames.length || !videoId) return;
    // 狭い画面（左マージンが取れない）では作らない
    if (window.innerWidth < 1180) return;

    // 見出しを「時刻↔Y座標」のアンカーにする
    var anchors = [];
    var hs = document.querySelectorAll('[data-ts]');
    for (var i = 0; i < hs.length; i++) {
      var t = parseFloat(hs[i].getAttribute('data-ts'));
      if (isNaN(t)) continue;
      anchors.push({ t: t, y: hs[i].getBoundingClientRect().top + window.pageYOffset });
    }
    if (!anchors.length) return;
    anchors.sort(function(a, b) { return a.t - b.t; });
    // 先頭(0,0)と末尾(動画終端, ページ下端)を補う
    if (anchors[0].t > 0) anchors.unshift({ t: 0, y: 0 });
    var last = frames[frames.length - 1];
    var endT = Math.max(data.duration || 0, last.end || last.start || 0, anchors[anchors.length - 1].t + 1);
    anchors.push({ t: endT, y: document.documentElement.scrollHeight });

    function timeToY(t) {
      if (t <= anchors[0].t) return anchors[0].y;
      for (var k = 0; k < anchors.length - 1; k++) {
        var a = anchors[k], b = anchors[k + 1];
        if (t >= a.t && t <= b.t) {
          return b.t === a.t ? a.y : a.y + (t - a.t) / (b.t - a.t) * (b.y - a.y);
        }
      }
      return anchors[anchors.length - 1].y;
    }

    var rail = document.createElement('div');
    rail.id = 'filmstrip-rail';
    rail.className = 'filmstrip-rail';
    document.body.appendChild(rail);
    var railTop = rail.getBoundingClientRect().top + window.pageYOffset;

    var MIN_GAP = 90; // フレーム高さ(83)＋余白。これより詰まる分は間引く
    var lastY = -Infinity;
    for (var j = 0; j < frames.length; j++) {
      var f = frames[j];
      var y = timeToY(f.start);
      if (y - lastY < MIN_GAP) continue; // 重なる分は自動間引き
      lastY = y;

      var frame = document.createElement('div');
      frame.className = 'filmstrip-frame';
      frame.style.top = (y - railTop) + 'px';
      frame.setAttribute('data-url', makeVideoLink(baseUrl, Math.floor(f.start)));
      frame.setAttribute('data-thumb-start', f.start);
      var im = document.createElement('img');
      im.src = f.src;
      im.loading = 'lazy';
      im.alt = '';
      im.onerror = function() { this.style.display = 'none'; };
      frame.appendChild(im);

      frame.addEventListener('click', function(e) {
        e.preventDefault();
        startGlobalVideo(this, this.getAttribute('data-url'), { kind: 'filmstrip' }, false, Number(this.getAttribute('data-thumb-start')));
      });

      rail.appendChild(frame);
    }
  }

  buildFilmstrip();
  // ウィンドウ幅の変化（ズーム含む）でレールを作り直す。読み込み時に幅が
  // 足りなかった場合でも、広げれば表示される。
  var filmstripResizeTimer = null;
  window.addEventListener('resize', function() {
    clearTimeout(filmstripResizeTimer);
    filmstripResizeTimer = setTimeout(buildFilmstrip, 250);
  });
  window.__rebuildFilmstrip = buildFilmstrip; // デバッグ・検証用
  // 画像読込でレイアウトが確定した後に再計算（アンカーY座標がずれるため）
  window.addEventListener('load', buildFilmstrip);

  // --- 見出しナビ：画面上下の「その方向の次の見出し」チップ＋展開式目次 ---
  function buildSectionNav() {
    var NAV_OFFSET = 48;      // ジャンプ後に見出しを置く位置（上端チップの下）
    var CHIP_GAP = 10;
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var heads = [];
    var hs = document.querySelectorAll('.timestamp-section > h1, .timestamp-section > h2, .timestamp-section > h3, .timestamp-section > h4, #detail-section > h2');
    for (var i = 0; i < hs.length; i++) {
      var el = hs[i];
      var tsAttr = el.getAttribute('data-ts');
      var ts = tsAttr == null ? null : parseFloat(tsAttr);
      heads.push({
        el: el,
        label: (el.getAttribute('data-heading-label') || el.textContent || '').replace(/\s+/g, ' ').trim(),
        ts: ts == null || isNaN(ts) ? null : ts,
        level: Number(el.tagName.charAt(1)) || 2
      });
    }
    if (heads.length < 2) return;

    function mk(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    }

    // --- チップ ---
    function makeChip(dir) {
      var chip = mk('div', 'secnav-chip secnav-' + dir + ' is-hidden');
      chip.setAttribute('role', 'navigation');
      chip.setAttribute('aria-label', dir === 'top' ? '前の見出し' : '次の見出し');
      var tocBtn = mk('button', 'secnav-toc-btn');
      tocBtn.type = 'button';
      tocBtn.setAttribute('aria-label', '目次を開く');
      tocBtn.setAttribute('aria-haspopup', 'dialog');
      tocBtn.title = '目次（見出し一覧）';
      tocBtn.appendChild(mk('span', 'secnav-toc-icon', '☰'));
      var count = mk('span', 'secnav-count', '');
      tocBtn.appendChild(count);
      var jump = mk('button', 'secnav-jump');
      jump.type = 'button';
      jump.appendChild(mk('span', 'secnav-arrow', dir === 'top' ? '↑' : '↓'));
      var time = mk('span', 'secnav-time', '');
      var label = mk('span', 'secnav-label', '');
      jump.appendChild(time);
      jump.appendChild(label);
      chip.appendChild(tocBtn);
      chip.appendChild(jump);
      document.body.appendChild(chip);
      tocBtn.addEventListener('click', function() { openToc(tocBtn); });
      jump.addEventListener('click', function() {
        var idx = Number(jump.getAttribute('data-target'));
        if (!isNaN(idx) && heads[idx]) scrollToHead(idx);
      });
      return { chip: chip, count: count, jump: jump, time: time, label: label };
    }
    var topChip = makeChip('top');
    var bottomChip = makeChip('bottom');

    function scrollToHead(idx) {
      var y = heads[idx].el.getBoundingClientRect().top + window.pageYOffset - NAV_OFFSET;
      window.scrollTo({ top: Math.max(0, y), behavior: (reduceMotion || document.hidden) ? 'auto' : 'smooth' });
    }

    function setChipTarget(c, idx, visible) {
      c.chip.classList.toggle('is-hidden', !visible);
      c.chip.setAttribute('aria-hidden', visible ? 'false' : 'true');
      c.jump.tabIndex = visible ? 0 : -1;
      c.chip.querySelector('.secnav-toc-btn').tabIndex = visible ? 0 : -1;
      if (idx < 0) return;
      var h = heads[idx];
      c.jump.setAttribute('data-target', idx);
      c.time.textContent = h.ts != null ? formatClock(h.ts) : '';
      c.time.style.display = h.ts != null ? '' : 'none';
      c.label.textContent = h.label;
      c.jump.title = h.label;
      c.jump.setAttribute('aria-label', (c === topChip ? '前の見出しへ: ' : '次の見出しへ: ') + h.label);
    }

    function visibleRect(node) {
      if (!node) return null;
      var cs = window.getComputedStyle(node);
      if (cs.display === 'none' || cs.visibility === 'hidden') return null;
      var r = node.getBoundingClientRect();
      if (r.width === 0 || r.height === 0 || r.right <= 0 || r.left >= window.innerWidth) return null;
      return r;
    }

    // 本文カラムの左端に揃え、右上dockの動画・右下の字幕トグルを避ける
    function layoutChips() {
      var body = document.body;
      var br = body.getBoundingClientRect();
      var bcs = window.getComputedStyle(body);
      var left = Math.max(8, br.left + (parseFloat(bcs.paddingLeft) || 0));
      var right = Math.min(window.innerWidth - 8, br.right - (parseFloat(bcs.paddingRight) || 0));
      var maxW = Math.max(120, Math.min(520, right - left));

      var topTop = 8, topMax = maxW;
      var ob = getGlobalVideoObstructionRect();
      if (ob && ob.top < topTop + 30 + CHIP_GAP && ob.right > left) {
        var avail = ob.left - CHIP_GAP - left;
        if (avail >= 200) topMax = Math.min(maxW, avail);
        else topTop = Math.round(ob.bottom + 8); // 狭い画面では動画（＋字幕）の下へ逃がす
      }
      topChip.chip.style.left = left + 'px';
      topChip.chip.style.top = topTop + 'px';
      topChip.chip.style.maxWidth = topMax + 'px';

      var bottomMax = maxW;
      var toggle = visibleRect(document.querySelector('.transcript-toggle'));
      if (toggle && toggle.top < window.innerHeight - 12 && toggle.left < left + maxW + CHIP_GAP) {
        bottomMax = Math.min(bottomMax, toggle.left - CHIP_GAP - left);
      }
      if (ob && ob.bottom > window.innerHeight - 12 - 30 - CHIP_GAP && ob.left < left + bottomMax + CHIP_GAP) {
        bottomMax = Math.min(bottomMax, Math.max(120, ob.left - CHIP_GAP - left));
      }
      bottomChip.chip.style.left = left + 'px';
      bottomChip.chip.style.maxWidth = Math.max(120, bottomMax) + 'px';
      return left;
    }

    var currentIdx = 0;
    var navScheduled = false;
    function updateNav() {
      navScheduled = false;
      layoutChips();
      var marker = window.innerHeight * 0.3;
      var cur = 0, upIdx = -1, downIdx = -1;
      for (var k = 0; k < heads.length; k++) {
        var top = heads[k].el.getBoundingClientRect().top;
        if (top <= marker) cur = k;
        if (top < NAV_OFFSET - 8) upIdx = k;
        if (downIdx < 0 && top > NAV_OFFSET + 8) downIdx = k;
      }
      currentIdx = cur;
      var doc = document.documentElement;
      var atTop = window.pageYOffset < 40;
      var atBottom = window.pageYOffset + window.innerHeight >= doc.scrollHeight - 8;
      setChipTarget(topChip, upIdx, !atTop && upIdx >= 0 && !tocOpen);
      setChipTarget(bottomChip, downIdx, !atBottom && downIdx >= 0 && !tocOpen);
      var countText = (cur + 1) + '/' + heads.length;
      topChip.count.textContent = countText;
      bottomChip.count.textContent = countText;
    }
    scheduleSectionNav = function() {
      if (navScheduled) return;
      navScheduled = true;
      if (document.hidden) setTimeout(updateNav, 0); // 非表示タブでは rAF が止まるため
      else window.requestAnimationFrame(updateNav);
    };

    // --- 目次パネル ---
    var tocOpen = false;
    var lastFocus = null;
    var backdrop = mk('div', 'toc-backdrop');
    var panel = mk('div', 'toc-panel');
    panel.setAttribute('role', 'dialog');
    panel.setAttribute('aria-modal', 'true');
    panel.setAttribute('aria-label', '目次');
    panel.setAttribute('translate', 'yes');
    var head = mk('div', 'toc-head');
    head.appendChild(mk('span', 'toc-title', '目次'));
    head.appendChild(mk('span', 'toc-hint', '↑↓で移動・Escで閉じる'));
    var closeBtn = mk('button', 'toc-close', '×');
    closeBtn.type = 'button';
    closeBtn.setAttribute('aria-label', '目次を閉じる');
    head.appendChild(closeBtn);
    panel.appendChild(head);
    var list = mk('ul', 'toc-list');
    var items = [];
    var num = 0;
    for (var t = 0; t < heads.length; t++) {
      var h = heads[t];
      var li = mk('li', 'toc-lv' + Math.min(4, Math.max(1, h.level)));
      var item = mk('button', 'toc-item');
      item.type = 'button';
      item.setAttribute('data-idx', t);
      item.appendChild(mk('span', 'toc-num', h.ts != null ? String(++num) : '•'));
      item.appendChild(mk('span', 'toc-text', h.label));
      item.addEventListener('click', function() {
        var idx = Number(this.getAttribute('data-idx'));
        closeToc(false);
        scrollToHead(idx);
      });
      li.appendChild(item);
      if (h.ts != null) {
        // 時刻バッジ：クリックで動画をその時刻へシーク（項目本体はページ内ジャンプ）
        var tb = mk('button', 'toc-time', formatClock(h.ts));
        tb.type = 'button';
        tb.title = 'この時刻から動画を再生';
        tb.setAttribute('aria-label', formatClock(h.ts) + ' から動画を再生');
        tb.setAttribute('data-video-time', h.ts);
        tb.addEventListener('click', function() {
          var sec = Number(this.getAttribute('data-video-time'));
          closeToc(false);
          startGlobalVideoAtTime(sec);
        });
        li.appendChild(tb);
      }
      list.appendChild(li);
      items.push(li);
    }
    panel.appendChild(list);
    document.body.appendChild(backdrop);
    document.body.appendChild(panel);

    function openToc(opener) {
      updateNav();
      lastFocus = opener || document.activeElement;
      for (var q = 0; q < items.length; q++) items[q].classList.toggle('is-current', q === currentIdx);
      var left = layoutChips();
      var pw = Math.min(440, window.innerWidth - 16);
      panel.style.left = Math.max(8, Math.min(left, window.innerWidth - pw - 8)) + 'px';
      tocOpen = true;
      panel.classList.add('is-open');
      backdrop.classList.add('is-open');
      topChip.chip.classList.add('is-hidden');
      bottomChip.chip.classList.add('is-hidden');
      var cur = items[currentIdx];
      list.scrollTop = Math.max(0, cur.offsetTop - list.clientHeight / 2 + cur.offsetHeight / 2);
      cur.querySelector('.toc-item').focus({ preventScroll: true });
    }
    function closeToc(restoreFocus) {
      if (!tocOpen) return;
      tocOpen = false;
      panel.classList.remove('is-open');
      backdrop.classList.remove('is-open');
      if (restoreFocus !== false && lastFocus && lastFocus.focus) {
        try { lastFocus.focus({ preventScroll: true }); } catch (err) {}
      } else if (document.activeElement && panel.contains(document.activeElement)) {
        document.activeElement.blur();
      }
      scheduleSectionNav();
    }
    closeBtn.addEventListener('click', function() { closeToc(); });
    backdrop.addEventListener('click', function() { closeToc(); });

    panel.addEventListener('keydown', function(e) {
      var buttons = Array.prototype.slice.call(list.querySelectorAll('.toc-item'));
      var pos = buttons.indexOf(document.activeElement);
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (pos < 0) {
          var timeBtn = document.activeElement && document.activeElement.closest && document.activeElement.closest('li');
          pos = timeBtn ? items.indexOf(timeBtn) : currentIdx;
        }
        var next = Math.max(0, Math.min(buttons.length - 1, pos + (e.key === 'ArrowDown' ? 1 : -1)));
        buttons[next].focus();
        buttons[next].scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Home' || e.key === 'End') {
        e.preventDefault();
        var b = buttons[e.key === 'Home' ? 0 : buttons.length - 1];
        b.focus();
        b.scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Tab') {
        // フォーカスをパネル内に閉じ込める
        var focusables = panel.querySelectorAll('button');
        var first = focusables[0], last = focusables[focusables.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && tocOpen) { e.preventDefault(); closeToc(); }
    });

    window.addEventListener('scroll', scheduleSectionNav, { passive: true });
    window.addEventListener('resize', scheduleSectionNav);
    window.addEventListener('load', scheduleSectionNav);
    updateNav();
  }

  buildSectionNav();

  // --- makeEmbedUrl, embedParams は不要になったが互換性のため残す ---
})();
</script>
</body>
</html>
